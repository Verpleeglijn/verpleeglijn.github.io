<!DOCTYPE html><html lang="nl-BE"><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#1E5A52"><title>Verslag An Claes · Verpleeglijn</title><link rel="icon" href="assets/mark.svg" type="image/svg+xml"><style>/* Verpleeglijn design tokens. See packages/brand/BRAND.md.
   Contrast (WCAG 2.x) is listed in BRAND.md; every text pair passes AA. */

:root {
  color-scheme: light dark;

  /* colour, light */
  --color-bg: #eef3f1; /* ochtendlicht: early-round daylight */
  --color-surface: #ffffff;
  --color-text: #1c2321;
  --color-text-muted: #5a6663;
  --color-border: #ddd8cd;
  --color-primary: #1e5a52; /* diepgroen */
  --color-on-primary: #ffffff;
  --color-primary-soft: #e3efec;
  --color-accent: #f6d98a; /* markeerstift: backgrounds only */
  --color-accent-soft: #fbefd0;
  --color-success: #226b47;
  --color-warning: #8a4b12;
  --color-danger: #a8281e;
  --color-on-danger: #ffffff;

  /* type */
  --font-sans: "Atkinson Hyperlegible Next", system-ui, -apple-system, "Segoe UI",
    Roboto, "Helvetica Neue", Arial, sans-serif;
  --text-sm: 0.875rem; /* 14: meta, timestamps; never smaller */
  --text-md: 1.0625rem; /* 17: body, the note */
  --text-lg: 1.25rem; /* 20: patient name */
  --text-xl: 1.5rem; /* 24: page title */
  --text-2xl: 2rem; /* 32: hero, mobile */
  --text-3xl: 2.75rem; /* 44: hero, desktop */
  --leading-body: 1.55;
  --leading-tight: 1.2;
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-bold: 700;

  /* space, 4-based */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;

  /* shape */
  --radius-sm: 6px; /* highlights */
  --radius-md: 10px; /* buttons */
  --radius-lg: 16px; /* cards */
  --radius-pill: 999px;

  /* depth, kept flat */
  --shadow-sm: 0 1px 2px rgba(28, 35, 33, 0.06);
  --shadow-md: 0 4px 16px rgba(28, 35, 33, 0.08);

  --measure: 65ch;
  --control-height: 48px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --color-bg: #121715;
    --color-surface: #1b2320;
    --color-text: #ece9e2;
    --color-text-muted: #a6afaa;
    --color-border: #2c3632;
    --color-primary: #8ccbc0;
    --color-on-primary: #121715;
    --color-primary-soft: #1f3531;
    --color-accent: #e9be62;
    --color-accent-soft: #3a3120;
    --color-success: #7fcf9f;
    --color-warning: #f0b072;
    --color-danger: #f28b80;
    --color-on-danger: #121715;
    --shadow-sm: none;
    --shadow-md: 0 0 0 1px var(--color-border);
  }
}
/* Verpleeglijn base styles: element defaults and the few shared components.
   Load after tokens.css. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: var(--leading-body);
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3 {
  line-height: var(--leading-tight);
  font-weight: var(--weight-bold);
  margin: 0 0 var(--space-3);
}

h1 {
  font-size: var(--text-xl);
}

h2 {
  font-size: var(--text-lg);
}

p {
  margin: 0 0 var(--space-4);
  max-width: var(--measure);
}

a {
  color: var(--color-primary);
  text-underline-offset: 3px;
}

:focus-visible {
  outline: 3px solid var(--color-primary);
  outline-offset: 2px;
}

/* Buttons: one primary action per screen. */
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--control-height);
  padding: 0 var(--space-6);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--color-primary);
  color: var(--color-on-primary);
  font: inherit;
  font-weight: var(--weight-bold);
  text-decoration: none;
  cursor: pointer;
}

.button:hover {
  filter: brightness(1.08);
}

.button--quiet {
  background: var(--color-primary-soft);
  color: var(--color-primary);
}

/* Cards hold one visit or one note. */
.card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-6);
  box-shadow: var(--shadow-sm);
}

/* The marker: facts the line read back (names, streets, numbers, medication). */
.marker {
  background: var(--color-accent);
  color: #1c2321;
  border-radius: var(--radius-sm);
  padding: 0 0.2em;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}

.muted {
  color: var(--color-text-muted);
}

.label {
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  color: var(--color-text-muted);
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

@font-face {
  font-family: "Atkinson Hyperlegible Next";
  font-style: normal;
  font-display: swap;
  font-weight: 200 800;
  src: url("assets/font.woff2") format("woff2");
}
body { max-width: 46rem; margin: 0 auto; padding: 0 var(--space-4) var(--space-12); }
.top { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-6) 0 var(--space-2); }
.top svg { width: 32px; height: 32px; flex: none; }
.top h1 { margin: 0; }
.menu { display: flex; gap: var(--space-4); flex-wrap: wrap; margin: var(--space-2) 0 0; }
.menu a[aria-current] { font-weight: var(--weight-bold); text-decoration: none; }
nav.days { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; margin: var(--space-4) 0 var(--space-6); }
nav.days input { font: inherit; min-height: var(--control-height); padding: 0 var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); background: var(--color-surface); color: var(--color-text); }
.visit { margin: var(--space-4) 0; }
.visit header { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-3); align-items: baseline; }
.visit .time { font-size: var(--text-sm); color: var(--color-text-muted); font-variant-numeric: tabular-nums; }
.visit .who { font-size: var(--text-lg); font-weight: var(--weight-bold); margin: 0; }
.visit .street { color: var(--color-text-muted); }
.visit .marker { color: #1c2321; }
.visit .label { margin: var(--space-1) 0 var(--space-3); }
.carried .label { color: var(--color-warning); }
.missing .label { color: var(--color-danger); }
.error { color: var(--color-danger); font-weight: var(--weight-bold); }
textarea { display: block; width: 100%; box-sizing: border-box; font: inherit; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); }
.older { margin: 0 0 var(--space-6); }
.text { white-space: pre-wrap; }
.visit .button { width: 100%; }
details { margin-top: var(--space-3); font-size: var(--text-sm); color: var(--color-text-muted); }
summary { cursor: pointer; padding: var(--space-3) 0; color: var(--color-primary); text-decoration: underline; text-underline-offset: 3px; }
@media (min-width: 40rem) { .visit .button { width: auto; } }

  if (!b) return;
  navigator.clipboard.writeText(b.dataset.t).then(() => {

});

  if (date.value < "2026-11-01" || date.value > "2026-11-05") { alert("De demo loopt van 1 tot 5 november 2026."); return; }
